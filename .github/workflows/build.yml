name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  PYINSTALLER_EXCLUDES: >-
    --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml
    --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets
    --exclude-module PySide6.QtTest --exclude-module PySide6.QtSql
    --exclude-module PySide6.QtXml --exclude-module PySide6.QtSvg
    --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets
    --exclude-module PySide6.QtDBus --exclude-module PySide6.QtConcurrent
    --exclude-module PySide6.QtUiTools --exclude-module PySide6.QtPdf
    --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtDesigner
    --exclude-module PySide6.QtHelp --exclude-module PySide6.QtWebSockets
    --exclude-module PySide6.QtSerialPort --exclude-module PySide6.QtRemoteObjects
    --exclude-module PySide6.QtStateMachine --exclude-module PySide6.QtScxml
    --exclude-module PySide6.QtPositioning

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x86_64
            ext: .exe
          - os: windows-11-arm
            suffix: windows-arm64
            ext: .exe
          # GitHub's Xcode 27 image: macOS 27 with the macOS 27.0 SDK
          # installed (Apple ships SDKs only inside Xcode/CLT, so the 27
          # SDK cannot be obtained on the macOS 26 `macos-latest` image)
          - os: xcode-27
            suffix: macos-arm64
            ext: ''
          - os: ubuntu-latest
            suffix: linux-x86_64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # the Windows arm64 image ships its own arm64 Python
      - uses: actions/setup-python@v7
        if: ${{ !(runner.os == 'Windows' && runner.arch == 'ARM64') }}
        with:
          python-version: '3.12'
      # macOS ships the native AppKit app (no Qt); other platforms use Qt
      - if: runner.os == 'macOS'
        run: python -m pip install pyinstaller chardet
      - if: runner.os != 'macOS'
        run: python -m pip install pyinstaller chardet PySide6-Essentials
      - name: Record macOS toolchain (macOS 27.0 SDK required)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          xcodebuild -version 2>/dev/null || true
          SDK="$(xcrun --show-sdk-version --sdk macosx)"
          echo "macOS SDK: $SDK"
          test "$SDK" = "27.0"
      - name: Install macOS native deps
        if: runner.os == 'macOS'
        run: python -m pip install pyobjc-framework-Cocoa
      # macOS: the native AppKit app (no Qt at all)
      - name: Build GUI (macOS, native, onefile windowed)
        if: runner.os == 'macOS'
        shell: bash
        run: >
          python -m PyInstaller --onefile --windowed --name format-tex-gui
          --distpath dist --workpath pyibuild --specpath pyibuild
          --hidden-import native_mac --hidden-import native_mac.menus
          --hidden-import native_mac.diffview
          --hidden-import native_mac.controls
          --hidden-import native_mac.shell
          --hidden-import native_mac.filelist
          --hidden-import format_tex_controller
          --hidden-import format_tex_theme
          format_tex_app_mac.py
      - name: Build GUI (onefile, windowed)
        if: runner.os != 'macOS'
        shell: bash
        run: >
          python -m PyInstaller --onefile --windowed --name format-tex-gui
          --distpath dist --workpath pyibuild --specpath pyibuild
          --hidden-import filelist_view --hidden-import diff_view
          --hidden-import format_tex_controller
          --hidden-import win32_list --hidden-import win11_style
          --hidden-import format_tex_theme
          $PYINSTALLER_EXCLUDES format_tex_gui.py
      - name: Build CLI (onefile)
        shell: bash
        run: >
          python -m PyInstaller --onefile --name format-tex
          --distpath dist --workpath pyibuild --specpath pyibuild
          format_tex.py
      - name: Rename artifacts
        shell: bash
        run: |
          mv "dist/format-tex-gui${{ matrix.ext }}" "dist/format-tex-gui-${{ matrix.suffix }}${{ matrix.ext }}"
          mv "dist/format-tex${{ matrix.ext }}" "dist/format-tex-${{ matrix.suffix }}${{ matrix.ext }}"
      - name: Build GUI onedir (Windows MSI payload)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --windowed --name format-tex-gui \
            --distpath dist-onedir --workpath pyibuild --specpath pyibuild \
            $PYINSTALLER_EXCLUDES format_tex_gui.py
          mkdir -p payload
          cp -R dist-onedir/format-tex-gui/. payload/
          # install the CLI under a platform-neutral name
          cp "dist/format-tex-${{ matrix.suffix }}.exe" payload/format-tex.exe
          ls payload | head
      - name: Build portable onedir ZIP (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # A onefile exe carries PyInstaller's archive appended to the
          # executable; if antivirus/WDAC strips or blocks that overlay the
          # bootloader reports "Could not load PyInstaller's embedded PKG
          # archive". The onedir build keeps the archive in _internal/ next
          # to the exe, so this ZIP is the portable, onefile-free option.
          python - "dist/format-tex-gui-${{ matrix.suffix }}-portable" <<'PY'
          import shutil
          import sys
          shutil.make_archive(sys.argv[1], 'zip', 'payload')
          PY
          ls -lh dist/*portable.zip
      - name: Upload Windows MSI payload
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: msi-payload-${{ matrix.suffix }}
          path: payload/
      - name: Patch macOS SDK claim (opt into Liquid Glass appearance)
        if: runner.os == 'macOS'
        env:
          MACOS_SDK_TARGET: '27.0'
        shell: bash
        run: |
          chmod +x macos_patch_sdk.sh
          ./macos_patch_sdk.sh dist
          vtool -show-build dist/format-tex-gui-macos-arm64 \
            | grep "sdk ${MACOS_SDK_TARGET}"
      - name: Smoke test CLI
        shell: bash
        run: |
          printf '\xe4\xb8\xad\xe6\x96\x87English\xe4\xb8\xad\xe6\x96\x87\n' > smoke.tex
          ./dist/format-tex-${{ matrix.suffix }}${{ matrix.ext }} --no-backup smoke.tex
          grep -q $'\xe4\xb8\xad\xe6\x96\x87 English \xe4\xb8\xad\xe6\x96\x87' smoke.tex
          # backups mirror the scanned root under <root>/backup
          mkdir -p smoke-root/sub
          printf '\xe4\xb8\xad\xe6\x96\x87English\xe4\xb8\xad\xe6\x96\x87\n' \
            > smoke-root/sub/t.tex
          ./dist/format-tex-${{ matrix.suffix }}${{ matrix.ext }} --recursive smoke-root
          test -f smoke-root/backup/sub/t.tex.bak
          test ! -f smoke-root/sub/t.tex.bak
          grep -q $'\xe4\xb8\xad\xe6\x96\x87English\xe4\xb8\xad\xe6\x96\x87' \
            smoke-root/backup/sub/t.tex.bak
          grep -q $'\xe4\xb8\xad\xe6\x96\x87 English \xe4\xb8\xad\xe6\x96\x87' \
            smoke-root/sub/t.tex
          # --tie: every separator is '~' instead of a space
          printf '\xe4\xb8\xad\xe6\x96\x87\\cite{1}\n' > tie.tex
          ./dist/format-tex-${{ matrix.suffix }}${{ matrix.ext }} \
            --tie --no-backup tie.tex
          grep -qF $'\xe4\xb8\xad\xe6\x96\x87~\\cite' tie.tex
          # ... including whitespace already present in the source
          printf '\xe4\xb8\xad\xe6\x96\x87English \xe4\xb8\xad\xe6\x96\x87\n' \
            > tie2.tex
          ./dist/format-tex-${{ matrix.suffix }}${{ matrix.ext }} \
            --tie --no-backup tie2.tex
          grep -qF $'\xe4\xb8\xad\xe6\x96\x87~English \xe4\xb8\xad\xe6\x96\x87' \
            tie2.tex
          # a space after a control word is preserved (not turned into '~')
          printf '\\hfill \xe4\xb8\xad\xe6\x96\x87\n' > tie3.tex
          ./dist/format-tex-${{ matrix.suffix }}${{ matrix.ext }} \
            --tie --no-backup tie3.tex
          grep -qF '\hfill ' tie3.tex
          ! grep -qF '\hfill~' tie3.tex
          # --extension accepts several suffixes (repeatable / comma-separated)
          mkdir -p ext-root
          printf '\xe4\xb8\xad\xe6\x96\x87English\xe4\xb8\xad\xe6\x96\x87\n' \
            > ext-root/a.tex
          printf '\xe4\xb8\xad\xe6\x96\x87English\xe4\xb8\xad\xe6\x96\x87\n' \
            > ext-root/b.ctx
          printf 'plain\n' > ext-root/c.md
          ./dist/format-tex-${{ matrix.suffix }}${{ matrix.ext }} \
            --no-backup --extension .tex --extension .ctx ext-root
          grep -q $'\xe4\xb8\xad\xe6\x96\x87 English \xe4\xb8\xad\xe6\x96\x87' \
            ext-root/a.tex
          grep -q $'\xe4\xb8\xad\xe6\x96\x87 English \xe4\xb8\xad\xe6\x96\x87' \
            ext-root/b.ctx
          # a suffix not in the list is left untouched
          grep -q '^plain$' ext-root/c.md
      - name: GUI self-test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 6
        shell: bash
        run: |
          mkdir -p /tmp/guiselftest && cd /tmp/guiselftest
          "$GITHUB_WORKSPACE/dist/format-tex-gui-macos-arm64" --self-test
          cat format_tex_mac_selftest.txt
          grep -q '^PASS' format_tex_mac_selftest.txt
          grep -q 'extension token field defaults' format_tex_mac_selftest.txt
      - name: GUI self-test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: bash
        run: |
          mkdir -p /tmp/guiselftest && cd /tmp/guiselftest
          rm -f format_tex_gui_selftest.txt
          # bound the run: a wedged native control can hang the UI thread,
          # and the report is checkpointed after every step
          "$GITHUB_WORKSPACE/dist/format-tex-gui-${{ matrix.suffix }}.exe" --self-test &
          pid=$!
          timed_out=0
          for _ in $(seq 1 48); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$pid" 2>/dev/null; then
            timed_out=1
            echo "::error::self-test still running after 240s; report so far:"
            kill "$pid" 2>/dev/null || true
          fi
          wait "$pid" 2>/dev/null || true
          echo "----- self-test report -----"
          cat format_tex_gui_selftest.txt
          # a killed (hung) run must not pass on the partial report
          if [ "$timed_out" = "1" ]; then
            echo "::error::self-test timed out and was killed"
            exit 1
          fi
          grep -q '^PASS' format_tex_gui_selftest.txt
          # Windows must actually host the native SysListView32, not the
          # Qt fallback: fail loudly if the native list did not activate.
          grep -q 'file list: natTrue/active:True' format_tex_gui_selftest.txt
          # ... and the option controls are drawn by Qt (Win11 dark style).
          grep -q 'controls: qt' format_tex_gui_selftest.txt
          grep -q 'extension chips default + add/remove: True' \
            format_tex_gui_selftest.txt
          grep -q 'qt style:' format_tex_gui_selftest.txt
          # ... and the host must not be layered (a layered host does not
          # render its child HWNDs, which hid every hosted control).
          grep -q 'win32 host layered: False' format_tex_gui_selftest.txt
      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dist/dmg
          mkdir -p dist/dmg/bin
          cp -R dist/format-tex-gui.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          cp dist/format-tex-macos-arm64 dist/dmg/bin/format-tex
          chmod +x dist/dmg/bin/format-tex
          # verify the payload before it is sealed into the image
          test -x dist/dmg/format-tex-gui.app/Contents/MacOS/format-tex-gui
          test -x dist/dmg/bin/format-tex
          test "$(readlink dist/dmg/Applications)" = "/Applications"
          dist/dmg/bin/format-tex --help | head -1
          # macOS 26 deprecates hdiutil entirely - create/attach/detach map
          # to `diskutil image create from`, `diskutil image attach` and
          # `diskutil eject` - so only current Apple tools are used here.
          rm -f dist/format-tex-gui-macos-arm64.dmg
          diskutil image create from --format UDZO \
            --volumeName "LaTeX Coding Style Formatter" \
            dist/dmg dist/format-tex-gui-macos-arm64.dmg
          rm -rf dist/dmg
          # mount-free verification of the finished image
          diskutil image info dist/format-tex-gui-macos-arm64.dmg \
            > /tmp/dmg_info.txt
          head -3 /tmp/dmg_info.txt
          grep -q "Image Format: UDZO" /tmp/dmg_info.txt
          diskutil image info --plist dist/format-tex-gui-macos-arm64.dmg \
            > /tmp/dmg_info.plist
          grep -q "<string>UDZO</string>" /tmp/dmg_info.plist
          test "$(stat -f%z dist/format-tex-gui-macos-arm64.dmg)" -gt 10000000
          ls -lh dist/*.dmg
      - name: Checksums
        shell: bash
        run: |
          # per-file hashes so a truncated/blocked download is obvious;
          # directories (the macOS .app) and the sums file are skipped
          cd dist
          : > SHA256SUMS.txt
          for f in *; do
            [ -f "$f" ] || continue
            if [ "$f" = "SHA256SUMS.txt" ]; then
              continue
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> SHA256SUMS.txt
            else
              shasum -a 256 "$f" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: format-tex-${{ matrix.suffix }}
          path: dist/*

  windows-msi:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install WiX
        shell: pwsh
        run: |
          # pinned: the OSMF acceptance token below is version specific
          # (wix7 for v7; upgrading to v8 would need -acceptEula wix8)
          dotnet tool install --global wix --version 7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Determine MSI version
        id: ver
        shell: bash
        run: |
          # Windows Installer compares ProductVersion to decide whether a
          # package is an upgrade: major/minor <= 255, build <= 65535. Use
          # the monotonic run number as the build field so *every* build is
          # strictly newer than the last and <MajorUpgrade> can remove the
          # previously installed product automatically.
          ref='${{ github.ref_name }}'
          run='${{ github.run_number }}'
          if [[ "$ref" =~ ^v([0-9]+)\.([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"
          else
            major=1; minor=0
          fi
          v="${major}.${minor}.$(( run % 65536 ))"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSI version: $v"
      - name: Download Windows payloads
        uses: actions/download-artifact@v8
        with:
          pattern: msi-payload-*
          path: payloads
      - name: Build MSIs (per-user, x64 + arm64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-msi | Out-Null
          $confirm = (Resolve-Path packaging/windows/confirm-upgrade.vbs).Path
          foreach ($a in @(@{suffix='windows-x86_64'; arch='x64'},
                           @{suffix='windows-arm64';  arch='arm64'})) {
            $payload = (Resolve-Path "payloads/msi-payload-$($a.suffix)").Path
            $count = (Get-ChildItem -Recurse -File $payload | Measure-Object).Count
            Write-Host "== $($a.suffix) (arch $($a.arch)): payload $payload, $count files"
            & wix build packaging/windows/format-tex.wxs -arch $($a.arch) `
              -acceptEula wix7 `
              -d PayloadDir="$payload" `
              -d Version="${{ steps.ver.outputs.version }}" `
              -d ConfirmVbs="$confirm" `
              -o "dist-msi/format-tex-$($a.suffix).msi" 2>&1 |
              ForEach-Object { Write-Host "   wix: $_" }
            if ($LASTEXITCODE -ne 0) {
              throw "wix build failed for $($a.suffix) (exit $LASTEXITCODE)"
            }
          }
      - name: Verify MSI contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @('format-tex-gui.exe', 'format-tex.exe')
          $version = '${{ steps.ver.outputs.version }}'
          $installer = New-Object -ComObject WindowsInstaller.Installer
          foreach ($msi in Get-ChildItem dist-msi/*.msi) {
            # SummaryInformation property 7 = Template (package platform)
            $summary = $installer.SummaryInformation($msi.FullName, 0)
            $template = $summary.Property(7)
            $db = $installer.OpenDatabase($msi.FullName, 0)
            $pview = $db.OpenView(
              "SELECT Value FROM Property WHERE Property='ProductVersion'")
            $pview.Execute()
            $product = $pview.Fetch().StringData(1)
            $pview.Close()
            if ($product -ne $version) {
              throw "$($msi.Name): ProductVersion $product != $version"
            }
            # upgrade wiring: stable UpgradeCode, RemoveExistingProducts and
            # the native confirmation custom action must all be present
            $upgrade_code = '6F3B0C2A-5D84-4E17-9A3C-1F0E7B2D54C8'
            $uv = $db.OpenView('SELECT UpgradeCode FROM Upgrade')
            $uv.Execute()
            $found_code = $false
            while ($null -ne ($r = $uv.Fetch())) {
              if ($r.StringData(1).Trim('{}').ToUpperInvariant() -eq
                  $upgrade_code) { $found_code = $true }
            }
            $uv.Close()
            $seq = @{}
            $sv = $db.OpenView('SELECT Action FROM InstallExecuteSequence')
            $sv.Execute()
            while ($null -ne ($r = $sv.Fetch())) { $seq[$r.StringData(1)] = $true }
            $sv.Close()
            $ca = @{}
            $cv = $db.OpenView('SELECT Action FROM CustomAction')
            $cv.Execute()
            while ($null -ne ($r = $cv.Fetch())) { $ca[$r.StringData(1)] = $true }
            $cv.Close()
            $wired = ($found_code -and $seq['RemoveExistingProducts'] -and
              $seq['AskCoverVersion'] -and $ca['AskCoverVersion'] -and
              $ca['CoverVersionAbort'])
            if (-not $wired) {
              throw ("$($msi.Name): upgrade wiring incomplete " +
                "(UpgradeCode $found_code, " +
                "RemoveExistingProducts $($seq['RemoveExistingProducts']), " +
                "AskCoverVersion $($seq['AskCoverVersion'])/$($ca['AskCoverVersion']), " +
                "CoverVersionAbort $($ca['CoverVersionAbort']))")
            }
            Write-Host '  upgrade wired: ok'
            if ($msi.Name -like '*arm64*') {
              # an arm64 MSI cannot be admin-extracted on an x64 host, so
              # read the File table; names are stored as short|long
              $fview = $db.OpenView('SELECT FileName FROM File')
              $fview.Execute()
              $names = @(); $raw = @(); $count = 0
              while ($null -ne ($record = $fview.Fetch())) {
                $value = $record.StringData(1)
                if ($raw.Count -lt 3) { $raw += $value }
                foreach ($part in $value.Split('|')) { $names += $part }
                $count++
              }
              $fview.Close()
              Write-Host ("  {0} files; template '{1}'; raw FileName: {2}" -f
                $count, $template, ($raw -join ' ; '))
              $lower = $names | ForEach-Object { $_.ToLowerInvariant() }
              $missing = $expected | Where-Object { $lower -notcontains $_ }
            } else {
              $tmp = Join-Path $env:TEMP $msi.BaseName
              Start-Process msiexec -Wait -ArgumentList @(
                '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$tmp`"")
              $found = @(Get-ChildItem -Path $tmp -Recurse -File |
                ForEach-Object { $_.Name.ToLowerInvariant() })
              Write-Host ("  {0} files extracted; template '{1}'" -f
                $found.Count, $template)
              $missing = $expected | Where-Object { $found -notcontains $_ }
            }
            if ($missing) {
              throw "$($msi.Name): missing $($missing -join ', ')"
            }
            Write-Host "$($msi.Name): verified (version $product)"
          }
      - name: Upgrade regression test (silent install over the previous build)
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          # Two consecutive versions from the same payload: installing the
          # second silently must RemoveExistingProducts (the old ProductCode
          # is gone and the new one is registered). The constant 1.0.0
          # version used to break this.
          $dir = Join-Path $env:RUNNER_TEMP 'upgrade-test'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $payload = (Resolve-Path 'payloads/msi-payload-windows-x86_64').Path
          $confirm = (Resolve-Path packaging/windows/confirm-upgrade.vbs).Path
          $msis = @{}
          foreach ($v in @('1.0.1', '1.0.2')) {
            $out = Join-Path $dir "upgrade-$v.msi"
            & wix build packaging/windows/format-tex.wxs -arch x64 `
              -acceptEula wix7 `
              -d PayloadDir="$payload" -d Version="$v" -d ConfirmVbs="$confirm" `
              -o "$out" 2>&1 |
              ForEach-Object { Write-Host "   wix: $_" }
            if ($LASTEXITCODE -ne 0) { throw "wix build failed for $v" }
            if (-not (Test-Path $out)) { throw "missing $out" }
            $msis[$v] = (Resolve-Path $out).Path
          }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          function Get-ProductCode($msi) {
            $db = $installer.OpenDatabase($msi, 0)
            $view = $db.OpenView(
              "SELECT Value FROM Property WHERE Property='ProductCode'")
            $view.Execute()
            $code = $view.Fetch().StringData(1)
            $view.Close()
            $code
          }
          function Test-Installed($code) {
            try { return [bool]$installer.ProductInfo($code, 'ProductName') }
            catch { return $false }
          }
          function Install-Msi($path) {
            $p = Start-Process msiexec -Wait -PassThru -ArgumentList @(
              '/i', "`"$path`"", '/qn', '/norestart', '/l*v', "`"$path.log`"")
            # 0 = ok, 3010 = success (reboot recommended)
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Get-Content "$path.log" -Tail 40 -ErrorAction SilentlyContinue |
                Write-Host
              throw "msiexec /i $path failed (exit $($p.ExitCode))"
            }
          }

          $old_code = Get-ProductCode $msis['1.0.1']
          $new_code = Get-ProductCode $msis['1.0.2']
          Write-Host "old ProductCode $old_code / new $new_code"
          if ($old_code -eq $new_code) {
            throw 'the two builds share a ProductCode (not a major upgrade)'
          }
          if ((Test-Installed $old_code) -or (Test-Installed $new_code)) {
            throw 'a test product is already installed'
          }

          Install-Msi $msis['1.0.1']
          $old_one = Test-Installed $old_code
          $new_one = Test-Installed $new_code
          Write-Host "after 1.0.1: old installed=$old_one new installed=$new_one"

          Install-Msi $msis['1.0.2']
          $old_two = Test-Installed $old_code
          $new_two = Test-Installed $new_code
          Write-Host "after 1.0.2: old installed=$old_two new installed=$new_two"

          # best-effort cleanup so the runner is left clean
          Start-Process msiexec -Wait -PassThru -ArgumentList @(
            '/x', "`"$($msis['1.0.2'])`"", '/qn', '/norestart') | Out-Null

          if (-not $old_one) { throw '1.0.1 did not install' }
          if ($old_two) {
            throw 'the 1.0.2 upgrade left the old product installed'
          }
          if (-not $new_two) { throw '1.0.2 did not install' }
          Write-Host 'upgrade replaces the previous version: ok'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: dist-msi/*.msi
