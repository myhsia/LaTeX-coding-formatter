name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  PYINSTALLER_EXCLUDES: >-
    --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml
    --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets
    --exclude-module PySide6.QtTest --exclude-module PySide6.QtSql
    --exclude-module PySide6.QtXml --exclude-module PySide6.QtSvg
    --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets
    --exclude-module PySide6.QtDBus --exclude-module PySide6.QtConcurrent
    --exclude-module PySide6.QtUiTools --exclude-module PySide6.QtPdf
    --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtDesigner
    --exclude-module PySide6.QtHelp --exclude-module PySide6.QtWebSockets
    --exclude-module PySide6.QtSerialPort --exclude-module PySide6.QtRemoteObjects
    --exclude-module PySide6.QtStateMachine --exclude-module PySide6.QtScxml
    --exclude-module PySide6.QtPositioning

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x86_64
            ext: .exe
          - os: windows-11-arm
            suffix: windows-arm64
            ext: .exe
          - os: macos-latest
            suffix: macos-arm64
            ext: ''
          - os: ubuntu-latest
            suffix: linux-x86_64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # the Windows arm64 image ships its own arm64 Python
      - uses: actions/setup-python@v5
        if: ${{ !(runner.os == 'Windows' && runner.arch == 'ARM64') }}
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller chardet PySide6-Essentials
      - name: Install macOS native-effect deps
        if: runner.os == 'macOS'
        run: python -m pip install pyobjc-framework-Cocoa
      - name: Build GUI (onefile, windowed)
        shell: bash
        run: >
          python -m PyInstaller --onefile --windowed --name format-tex-gui
          --distpath dist --workpath pyibuild --specpath pyibuild
          $PYINSTALLER_EXCLUDES format_tex_gui.py
      - name: Build CLI (onefile)
        shell: bash
        run: >
          python -m PyInstaller --onefile --name format-tex
          --distpath dist --workpath pyibuild --specpath pyibuild
          format_tex.py
      - name: Rename artifacts
        shell: bash
        run: |
          mv "dist/format-tex-gui${{ matrix.ext }}" "dist/format-tex-gui-${{ matrix.suffix }}${{ matrix.ext }}"
          mv "dist/format-tex${{ matrix.ext }}" "dist/format-tex-${{ matrix.suffix }}${{ matrix.ext }}"
      - name: Build GUI onedir (Windows MSI payload)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --windowed --name format-tex-gui \
            --distpath dist-onedir --workpath pyibuild --specpath pyibuild \
            $PYINSTALLER_EXCLUDES format_tex_gui.py
          mkdir -p payload
          cp -R dist-onedir/format-tex-gui/. payload/
          cp "dist/format-tex-${{ matrix.suffix }}.exe" payload/
          ls payload | head
      - name: Upload Windows MSI payload
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msi-payload-${{ matrix.suffix }}
          path: payload/
      - name: Patch macOS SDK claim (opt into Liquid Glass appearance)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x macos_patch_sdk.sh
          ./macos_patch_sdk.sh dist
          vtool -show-build dist/format-tex-gui-macos-arm64 | grep 'sdk 26.0'
      - name: Smoke test CLI
        shell: bash
        run: |
          printf '\xe4\xb8\xad\xe6\x96\x87English\xe4\xb8\xad\xe6\x96\x87\n' > smoke.tex
          ./dist/format-tex-${{ matrix.suffix }}${{ matrix.ext }} --no-backup smoke.tex
          grep -q $'\xe4\xb8\xad\xe6\x96\x87 English \xe4\xb8\xad\xe6\x96\x87' smoke.tex
      - name: GUI self-test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p /tmp/guiselftest && cd /tmp/guiselftest
          "$GITHUB_WORKSPACE/dist/format-tex-gui-macos-arm64" --self-test
          grep -q '^PASS' format_tex_gui_selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: format-tex-${{ matrix.suffix }}
          path: dist/*

  windows-msi:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WiX
        shell: pwsh
        run: |
          # pinned: the OSMF acceptance token below is version specific
          # (wix7 for v7; upgrading to v8 would need -acceptEula wix8)
          dotnet tool install --global wix --version 7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Determine MSI version
        id: ver
        shell: bash
        run: |
          ref='${{ github.ref_name }}'
          if [[ "$ref" =~ ^v([0-9]+\.[0-9]+)(\.[0-9]+)?$ ]]; then
            v="${BASH_REMATCH[1]}${BASH_REMATCH[2]:-.0}"
          else
            v="1.0.0"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSI version: $v"
      - name: Download Windows payloads
        uses: actions/download-artifact@v4
        with:
          pattern: msi-payload-*
          path: payloads
      - name: Build MSIs (per-user, x64 + arm64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-msi | Out-Null
          foreach ($a in @(@{suffix='windows-x86_64'; arch='x64'},
                           @{suffix='windows-arm64';  arch='arm64'})) {
            $payload = (Resolve-Path "payloads/msi-payload-$($a.suffix)").Path
            wix build packaging/windows/format-tex.wxs -arch $($a.arch) `
              -acceptEula wix7 `
              -d PayloadDir="$payload" `
              -d Version="${{ steps.ver.outputs.version }}" `
              -o "dist-msi/format-tex-$($a.suffix).msi"
          }
      - name: Verify MSI contents
        shell: pwsh
        run: |
          # read the MSI database (works for any architecture - an
          # arm64 MSI cannot be admin-extracted on an x64 host)
          $expected = @('format-tex-gui.exe', 'format-tex.exe')
          $version = '${{ steps.ver.outputs.version }}'
          foreach ($msi in Get-ChildItem dist-msi/*.msi) {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $db = $installer.OpenDatabase($msi.FullName, 0)
            $view = $db.OpenView('SELECT FileName FROM File')
            $view.Execute()
            $names = @()
            while ($null -ne ($record = $view.Fetch())) {
              $names += $record.StringData(1).Split('|')[0]
            }
            $view.Close()
            $pview = $db.OpenView(
              "SELECT Value FROM Property WHERE Property='ProductVersion'")
            $pview.Execute()
            $prec = $pview.Fetch()
            $product = $prec.StringData(1)
            $pview.Close()
            $missing = $expected | Where-Object { $names -notcontains $_ }
            if ($missing) {
              throw "$($msi.Name): missing $($missing -join ', ')"
            }
            if ($product -ne $version) {
              throw "$($msi.Name): ProductVersion $product != $version"
            }
            Write-Host "$($msi.Name): $($names.Count) files, version $product, expected executables present"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist-msi/*.msi
